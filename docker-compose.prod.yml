# Production-flavoured docker-compose.
#
# Differences from the dev docker-compose.yml at the repo root:
#   - Services bind to 127.0.0.1, never to 0.0.0.0
#   - LiveKit runs in production mode (not --dev), with TURN config from a mounted file
#   - Postgres and Redis require passwords (from .env)
#   - Caddy fronts everything with TLS
#
# Build and run from the repo root:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_BACKEND_URL: ${PUBLIC_BACKEND_URL}
        VITE_LIVEKIT_URL: ${LIVEKIT_URL}
    restart: unless-stopped
    expose:
      - '80'

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    expose:
      - '3000'
    volumes:
      - ./data/debug-logs:/data/debug-logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bind to localhost only — accessible to other compose services via the
    # internal network, but never exposed to the public internet.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-changeme}']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-changeme}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    # Production mode: load config from a mounted file. Edit infra/livekit.yaml
    # to set TURN, keys, ICE candidates, external IP, etc.
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

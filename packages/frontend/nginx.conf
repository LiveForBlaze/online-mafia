# nginx config baked into the frontend Docker image.
# Single-page app fallback: any unknown path serves index.html so client-side
# routing works (deep links to /lobby/:id, /game/:id, etc.).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Aggressive cache for hashed assets, no-cache for the index document.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # gzip text payloads
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;
}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # shared must be compiled to dist/ before typecheck and tests can import it.
      - name: Build shared
        run: pnpm --filter @mafia/shared build

      # Prisma client is generated against schema.prisma — needed before typecheck.
      - name: Prisma generate
        run: pnpm --filter @mafia/backend db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Surface high-severity dependency advisories. Kept NON-blocking for now
      # (`|| true`): a transient upstream advisory shouldn't wall off the deploy
      # of unrelated changes, and we have no triage rotation yet. The log is the
      # signal — flip this to blocking once advisories are actively tracked.
      - name: Audit dependencies
        run: pnpm audit --audit-level high || true

      - name: Build
        run: pnpm run build

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            # ORDERING CAVEAT: the container is rebuilt+started BEFORE migrations
            # run, so for a brief window new code runs against the OLD schema.
            # For backward-incompatible migrations (dropped/renamed columns) this
            # can cause transient errors until `migrate deploy` completes below.
            # We can't safely move `migrate deploy` earlier: the Prisma CLI and
            # migration files live INSIDE the backend image and are invoked via
            # `exec` on the freshly built container — the old image predates the
            # new migrations. Mitigation is to keep migrations backward-compatible
            # (expand/contract), not to reorder these steps.
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy
            docker image prune -f

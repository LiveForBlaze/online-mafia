# LiveKit production configuration. Replace placeholders before deploy.
# Docs: https://docs.livekit.io/realtime/self-hosting/deployment/

port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  # Real public IP of the VPS. Required so ICE candidates work for clients.
  use_external_ip: true

keys:
  # The API key/secret pair used by the backend to sign access tokens.
  # Must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in the backend's .env.
  devkey: CHANGE_ME_LIVEKIT_API_SECRET_AT_LEAST_32_CHARS_LONG

logging:
  level: info
  pion_level: warn

# Built-in TURN. Players behind symmetric NAT need this to reach the SFU.
turn:
  enabled: true
  domain: livekit.online-mafia.com
  # Either use the same Let's Encrypt cert as your domain or specify cert paths here.
  tls_port: 5349
  udp_port: 3478
  external_tls: true

room:
  enabled_codecs:
    - mime: video/vp8
    - mime: video/h264
    - mime: audio/opus
  empty_timeout: 30s
  departure_timeout: 5s
